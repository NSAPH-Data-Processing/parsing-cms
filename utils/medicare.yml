      #     cast:
      #       '*': "array_value({columns})"
          # group_by:
          #   - bene_id



          # - file
          # - record
  ps:
    name: "ps"
    description: "Patient Summary view combining multiple MBSF files"
    path_pattern: "{basepath}/{year}/mbsf_ab*/part-*.parquet"
    columns:
      - bene_id
      - file
      - record

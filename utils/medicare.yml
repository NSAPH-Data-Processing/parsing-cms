schema: "medicare"
description: "Data model for Medicare, including beneficiary and enrollment tables."
basepath: "/n/dominici_nsaph_l3/Lab/data/data_warehouse/dw_raw_medicare"  # Base directory for Parquet files
tables:
  mbsf_d:
    name: "mbsf_d"
    description: Data from mbsf_d* Parquet files used to create beneficiary and enrollment tables.
    path_pattern: "{basepath}/{year}/mbsf_*d*/part-*.parquet"
    columns:
      - bene_id
      - year:
          rename_source: "RFRNC_YR"  
      - dual_mo:
          type: INT
          cast:
            '*': "{column_name}::INT"
      # - dual_indicators:
      #     type: CHAR(1)[12]
      #     m: ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12']
